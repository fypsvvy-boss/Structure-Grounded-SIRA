# SIRA-CTI default configuration.
# Record the hash of this file with every results artefact (README, Reproducibility).

retrieval:
  w: 1.0                 # expansion weight in score(d) = BM25(q_orig,d) + w*BM25(q_exp,d)
  k1: 0.9                # BM25 params matching the Phase 0 SciFact reproduction
  b: 0.4
  top_k: 100
  synthesis_budget: 5    # extra graph-grounded queries for multi-doc synthesis (evidence-blind)
  rrf_k: 60              # reciprocal-rank-fusion constant for merging synthesis sub-queries
  # Which Lucene fields each half of the formula searches, and at what boost:
  # BM25(q, d) = sum over fields of boost * BM25_field(q, d). Both halves search
  # both fields by default -- see retrieval/weighted_bm25.py and docs/05_MODULE3_STATE.md.
  fields:
    orig: {contents: 1.0, expansion: 1.0}
    exp:  {contents: 1.0, expansion: 1.0}
  id_boost: 0.0          # >0 lets an id named in the query match the entry whose id it is; off by default

baselines:
  hybrid:
    model: sentence-transformers/all-MiniLM-L6-v2
    alpha: 0.5           # score = alpha*dense + (1-alpha)*bm25, both rescaled to [0,1]
    depth: 1000          # candidates taken from each half before mixing
    cache_dir: indexes/dense
  agent:
    max_rounds: 3        # searches per question; each one after the first costs an LLM call
    read_k: 5            # results shown to the model per round
    snippet_chars: 400

enrichment:
  max_terms_per_doc: 12
  max_terms_per_query: 8
  df_max_ratio: 0.10     # reject terms appearing in >10% of the (base) corpus (too_common)
  df_min_count: 1        # reject terms absent from the index (not_in_index)
  require_in_index: true # query-side terms must already exist in the enriched index
  # The prompt version is no longer set here: scripts/enrich_corpus.py records
  # prompts/corpus_side.py:PROMPT_VERSION directly, so the manifest can't claim a
  # version the prompt doesn't have.
  concurrency: 2                  # Ollama is local -- keep modest by default
  max_new_tokens: 512     # cap on reply length; reaches Ollama as options.num_predict
  # Constrained decoding. "schema" sends prompts/corpus_side.py:REPLY_SCHEMA as
  # Ollama's "format", which is the only one of the three that actually fixed
  # CAPEC-587: unconstrained dropped an opening brace mid-array, and plain
  # "json" made qwen2.5:14b answer with a single object instead of an array of
  # twelve. Needs Ollama >= 0.5 (structured outputs); "json" is the fallback.
  json_mode: schema       # schema | json | off
  json_retries: 1         # retry a parse failure once, with an explicit nudge
  record_json_failures: true  # then write the doc as reject_reason=llm_json_error
                              # rather than leaving it to be retried forever at
                              # temperature 0 (see docs/04_OPEN_QUESTIONS.md q9)

  # Name-ID consistency (schema 1.2.0). The model states the title it thinks a
  # structural id has; the graph compares that to MITRE's. Scored as an overlap
  # coefficient over content words, so a short correct answer ("Cross-site
  # Scripting") matches a long official title. null disables the check and
  # reproduces corpus-v3 behaviour exactly, which is how the before/after
  # comparison is run without editing this file.
  name_match_min_overlap: 0.5
  # Which name scorer adjudicates (sira_cti.graph.ontology.NAME_SCORERS), and
  # the threshold v2/v3 use. v1 = overlap against the title (the corpus-v4 runs);
  # v2 = symmetric match on CWE short names, v1 where a node has none;
  # v3 = symmetric everywhere (experimental). Recorded per term as name_scorer.
  name_scorer: v1
  name_match_min_jaccard: 0.6
  # Retrieval ablation for Modules 3/4, OFF by default: also index the id a
  # name-mismatched proposal was probably meant to be (ProposedTerm.repaired_to).
  # The term itself stays rejected either way.
  index_repaired_ids: false

graph:
  # Pinned to ATT&CK v17.1 (mitre-attack/attack-stix-data), the last release
  # before CTIConnect's 2025-09-01 snapshot — see data/README.md for why.
  attack_path:
    - data/raw/attack/enterprise-attack.json
    - data/raw/attack/mobile-attack.json
    - data/raw/attack/ics-attack.json
  cwe_path: data/raw/cwe/cwec_latest.xml.zip
  capec_path: data/raw/capec/capec_latest.xml
  domains: [enterprise-attack, mobile-attack, ics-attack]
  allow_deprecated: false      # flip to true only for the RQ4 ablation
  revoked_policy: reject       # reject | repair -- repair rewrites canonical_id to
                                # replacement_id instead of failing validation; the
                                # rejection log still records that a repair happened
                                # (ValidationResult.repaired), it just isn't dropped here
  include_siblings: false      # sibling expansion dilutes BM25 discriminative weight

llm:
  backend: ollama              # ollama | openai-compatible
  model: qwen2.5:7b            # frontier model reserved for the final benchmark run
  host: http://localhost:11434
  temperature: 0.0
  max_retries: 2

corpus:
  # CTIConnect's own structured knowledge base -- see data/README.md. Doc ids
  # are canonicalised to match CTIConnect's own baseline convention (CVE-…,
  # CWE-…, CAPEC-…, T####[.###]) so the index this module builds stays
  # doc-id-compatible with CTIConnect's qrels and other baselines.
  kb_dir: data/CTIConnect/corpus_kb
  kinds: [cve, cwe, capec, mitre]

index:
  base_dir: indexes/base          # unenriched -- also Module 3's plain-BM25 baseline
  enriched_dir: indexes/enriched  # base contents + an "expansion" field of accepted terms
  enrichment_path: indexes/enrichment/corpus.jsonl  # scripts/enrich_corpus.py's output
  threads: 2
  stemmer: porter                 # matches the Phase 0 SciFact reproduction

eval:
  seed: 42
  metrics: [recall@1, recall@10, recall@100, ndcg@10]

  # Deprecated identifiers are rejected. Known cost: CWE-264 appears in
  # CTIConnect gold (1 row of 1,859). Admitting deprecated entries to recover
  # it would open all 335 deprecated nodes to the expansion vocabulary — a
  # broad change for a rounding error, and harder to defend as a pre-registered
  # choice. allow_deprecated=True is retained for the ablation.
  allow_deprecated: false