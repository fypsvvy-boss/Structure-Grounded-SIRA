# SIRA-CTI default configuration.
# Record the hash of this file with every results artefact (README, Reproducibility).

retrieval:
  w: 1.0                 # expansion weight in score(d) = BM25(q_orig,d) + w*BM25(q_exp,d)
  k1: 0.9                # BM25 params matching the Phase 0 SciFact reproduction
  b: 0.4
  top_k: 100
  synthesis_budget: 5    # extra graph-grounded queries for multi-doc synthesis (evidence-blind)

enrichment:
  max_terms_per_doc: 12
  max_terms_per_query: 8
  df_max_ratio: 0.10     # reject terms appearing in >10% of the (base) corpus (too_common)
  df_min_count: 1        # reject terms absent from the index (not_in_index)
  require_in_index: true # query-side terms must already exist in the enriched index
  corpus_prompt_version: corpus-v1   # keep in step with prompts/corpus_side.py:PROMPT_VERSION
                                     # (corpus-v2 was tried and reverted:
                                     #  docs/experiments/prompt-corpus-v2.md)
  concurrency: 2                  # Ollama is local -- keep modest by default
  max_new_tokens: 512

graph:
  # Pinned to ATT&CK v17.1 (mitre-attack/attack-stix-data), the last release
  # before CTIConnect's 2025-09-01 snapshot — see data/README.md for why.
  attack_path:
    - data/raw/attack/enterprise-attack.json
    - data/raw/attack/mobile-attack.json
    - data/raw/attack/ics-attack.json
  cwe_path: data/raw/cwe/cwec_latest.xml.zip
  capec_path: data/raw/capec/capec_latest.xml
  domains: [enterprise-attack, mobile-attack, ics-attack]
  allow_deprecated: false      # flip to true only for the RQ4 ablation
  revoked_policy: reject       # reject | repair -- repair rewrites canonical_id to
                                # replacement_id instead of failing validation; the
                                # rejection log still records that a repair happened
                                # (ValidationResult.repaired), it just isn't dropped here
  include_siblings: false      # sibling expansion dilutes BM25 discriminative weight

llm:
  backend: ollama              # ollama | openai-compatible
  model: qwen2.5:7b            # frontier model reserved for the final benchmark run
  host: http://localhost:11434
  temperature: 0.0
  max_retries: 2

corpus:
  # CTIConnect's own structured knowledge base -- see data/README.md. Doc ids
  # are canonicalised to match CTIConnect's own baseline convention (CVE-…,
  # CWE-…, CAPEC-…, T####[.###]) so the index this module builds stays
  # doc-id-compatible with CTIConnect's qrels and other baselines.
  kb_dir: data/CTIConnect/corpus_kb
  kinds: [cve, cwe, capec, mitre]

index:
  base_dir: indexes/base          # unenriched -- also Module 3's plain-BM25 baseline
  enriched_dir: indexes/enriched  # base contents + an "expansion" field of accepted terms
  enrichment_path: indexes/enrichment/corpus.jsonl  # scripts/enrich_corpus.py's output
  threads: 2
  stemmer: porter                 # matches the Phase 0 SciFact reproduction

eval:
  seed: 42
  metrics: [recall@1, recall@10, recall@100, ndcg@10]

  # Deprecated identifiers are rejected. Known cost: CWE-264 appears in
  # CTIConnect gold (1 row of 1,859). Admitting deprecated entries to recover
  # it would open all 335 deprecated nodes to the expansion vocabulary — a
  # broad change for a rounding error, and harder to defend as a pre-registered
  # choice. allow_deprecated=True is retained for the ablation.
  allow_deprecated: false