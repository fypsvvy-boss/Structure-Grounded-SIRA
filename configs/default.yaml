# SIRA-CTI default configuration.
# Record the hash of this file with every results artefact (README, Reproducibility).

retrieval:
  w: 1.0                 # expansion weight in score(d) = BM25(q_orig,d) + w*BM25(q_exp,d)
  k1: 0.9                # BM25 params matching the Phase 0 SciFact reproduction
  b: 0.4
  top_k: 100
  synthesis_budget: 5    # extra graph-grounded queries for multi-doc synthesis (evidence-blind)

enrichment:
  max_terms_per_doc: 12
  max_terms_per_query: 8
  df_max_ratio: 0.10     # reject terms appearing in >10% of the corpus (too_common)
  df_min_count: 1        # reject terms absent from the index (not_in_index)
  require_in_index: true # query-side terms must already exist in the enriched index

graph:
  attack_path: data/raw/attack/enterprise-attack.json
  cwe_path: data/raw/cwe/cwec_latest.xml
  capec_path: data/raw/capec/capec_latest.xml
  domains: [enterprise-attack]
  allow_deprecated: false      # flip to true only for the RQ4 ablation
  include_siblings: false      # sibling expansion dilutes BM25 discriminative weight

llm:
  backend: ollama              # ollama | openai-compatible
  model: qwen2.5:7b            # frontier model reserved for the final benchmark run
  host: http://localhost:11434
  temperature: 0.0
  max_retries: 2

eval:
  seed: 42
  metrics: [recall@1, recall@10, recall@100, ndcg@10]
